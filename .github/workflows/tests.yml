name: Offline benchmark tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.10'
            extras: 'charts,dev'
          - python-version: '3.13'
            extras: 'all,charts,dev'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py
      - run: python -m pip install -e '.[${{ matrix.extras }}]' build
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: echo '/usr/games' >> "$GITHUB_PATH"
      - run: python -m pytest tests -q -W error::RuntimeWarning
      - run: python main.py --estimate-cost --preset budget --max-games 2
      - run: python -m chess_llm_bench.runner --output-dir /tmp/chess-ci-smoke --offline --games 2 --max-plies 8
      - run: python -m build
